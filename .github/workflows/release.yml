name: release

# Manual release gate for one image digest:
#   verify provenance + scan attestations -> evidence bundle (verified data only)
#   -> OPA decision (auto_approve | manual | reject) -> mock ServiceNow CR
#   -> if manual: GitHub Environment approval (protected env "release-approval")
#   -> mock SD Elements countermeasure update (CI token only).
#
# Mock APIs run locally, exposed via a cloudflared quick tunnel; pass its https
# URL as mock_base_url. Tokens live in the protected "release" environment.

on:
  workflow_dispatch:
    inputs:
      image:
        description: Image name without tag/digest, e.g. ghcr.io/rajumandala/supply-chain-lab
        required: true
      digest:
        description: Image digest, e.g. sha256:abc...
        required: true
      pr_number:
        description: PR number whose files define changed_paths (0 = none)
        default: "0"
        required: false
      mock_base_url:
        description: Tunnel base URL for local mock ServiceNow / SD Elements
        required: true

permissions:
  contents: read
  packages: read
  id-token: write

env:
  IMAGE: ${{ inputs.image }}
  DIGEST: ${{ inputs.digest }}
  SOURCE: github.com/${{ github.repository }}
  RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  decide:
    name: decide
    environment: release
    outputs:
      decision: ${{ steps.opa.outputs.decision }}
      reasons: ${{ steps.opa.outputs.reasons }}
      cr_id: ${{ steps.cr.outputs.cr_id }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Install slsa-verifier + opa
        run: |
          curl -sSfL -o sv "https://github.com/slsa-framework/slsa-verifier/releases/download/v2.7.1/slsa-verifier-linux-amd64"
          chmod +x sv && sudo mv sv /usr/local/bin/slsa-verifier
          curl -sSfL -o opa "https://github.com/open-policy-agent/opa/releases/download/v1.21.4/opa_linux_amd64_static"
          chmod +x opa && sudo mv opa /usr/local/bin/opa

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- verification: only *verified* data enters the evidence bundle ----
      # Native SLSA L3 provenance: the generator stores it in the legacy
      # `.att` tag; slsa-verifier verifies it against a pinned builder id
      # (the tag-pinned slsa-github-generator) and our repo. --print-provenance
      # emits verified in-toto statements (one JSON per line) for evidence.json.
      - name: Verify SLSA L3 provenance (slsa-verifier, builder pinned)
        id: prov
        env:
          BUILDER_ID: "https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@refs/tags/v2.1.0"
        run: |
          set +e
          slsa-verifier verify-image "$IMAGE@$DIGEST" \
            --builder-id "$BUILDER_ID" \
            --source-uri "$SOURCE" \
            --print-provenance > prov_stmts.json 2> prov_verify.log
          code=$?
          set -e
          echo "slsa-verifier exit: $code"
          tail -2 prov_verify.log
          echo "verified=$([ $code -eq 0 ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
          
      - name: Verify scan attestations (cosign, workflow identity)
        env:
          REPO: ${{ github.repository }}
        run: |
          set +e
          cosign verify-attestation --output json \
            --type "https://scs-lab.dev/scan-result/v1" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "^https://github.com/$REPO/.github/workflows/build.yml@refs/heads/main\$" \
            "$IMAGE@$DIGEST" > scans_att.json
          code=$?
          set -e
          echo "cosign exit: $code"
          python3 scripts/decode_attestations.py scans_att.json "https://scs-lab.dev/scan-result/v1" > scans_stmts.json
          echo "decoded $(wc -l < scans_stmts.json | tr -d ' ') verified scan statement(s)"

      # NOTE: cosign v3 stores scan-result attestations as OCI-referrer
      # bundles (fallback tag scheme on GHCR) and verifies them with the
      # caller workflow's Fulcio identity.
      - name: Collect changed paths
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "0" ]; then
            gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate \
              --jq '.[].filename' > changed_paths.txt || true
          else
            : > changed_paths.txt
          fi
          echo "changed paths: $(grep -c . changed_paths.txt || true)"

      # ---- evidence bundle + OPA decision ----
      - name: Build evidence bundle (verified data only)
        run: |
          python3 scripts/build_evidence.py \
            "${{ steps.prov.outputs.verified }}" \
            prov_stmts.json scans_stmts.json changed_paths.txt > evidence.json
          cat evidence.json

      - name: OPA decision (policy/release.rego)
        id: opa
        run: |
          opa eval -d policy/ -I --format=json 'data.release' < evidence.json > opa_out.json
          decision="$(jq -r '.result[0].expressions[0].value.decision' opa_out.json)"
          reasons="$(jq -r '.result[0].expressions[0].value.reasons | join("; ")' opa_out.json)"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "reasons=$reasons" >> "$GITHUB_OUTPUT"
          {
            echo "## Release decision: **$decision**"
            echo ""
            echo "Reasons: $reasons"
            echo ""
            echo '```json'
            cat evidence.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          jq '.result[0].expressions[0].value' opa_out.json > decision.json

      # ---- mock ServiceNow CR, evidence bound ----
      - name: File mock change request
        id: cr
        env:
          DECISION: ${{ steps.opa.outputs.decision }}
          REASONS: ${{ steps.opa.outputs.reasons }}
          MOCK_URL: ${{ inputs.mock_base_url }}
          CR_TOKEN: ${{ secrets.MOCK_CR_TOKEN }}
        run: |
          jq -n --arg decision "$DECISION" \
                --arg digest "$DIGEST" --arg run_url "$RUN_URL" \
                --arg reasons "$REASONS" \
                --slurpfile evidence evidence.json \
                '{decision: $decision, digest: $digest, run_url: $run_url,
                  reasons: $reasons, evidence: $evidence[0]}' > cr.json
          resp="$(curl -fsS -X POST "$MOCK_URL/change" \
            -H "Authorization: Bearer $CR_TOKEN" \
            -H "Content-Type: application/json" \
            --data @cr.json)"
          cid="$(echo "$resp" | jq -r '.id')"
          echo "cr_id=$cid" >> "$GITHUB_OUTPUT"
          echo "mock CR filed: $cid ($MOCK_URL/change/$cid)"

      - name: Save evidence artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence
          path: |
            evidence.json
            decision.json
            scans_stmts.json
            prov_stmts.json
            changed_paths.txt
          if-no-files-found: error

  # ------------------------ routing -------------------------------------------
  approval:
    name: approval
    if: needs.decide.outputs.decision == 'manual'
    needs: [decide]
    environment: release-approval # required-reviewer gate for the manual route
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Holding for human approval (manual route)
        run: |
          echo "decision: manual -> approval required in the 'release-approval' environment"
          echo "digest: $DIGEST"

      - name: Mark mock CR approved
        env:
          MOCK_URL: ${{ inputs.mock_base_url }}
          CR_TOKEN: ${{ secrets.MOCK_CR_TOKEN }}
          CR_ID: ${{ needs.decide.outputs.cr_id }}
        run: |
          curl -fsS -X POST \
            "$MOCK_URL/change/$CR_ID/resolve" \
            -H "Authorization: Bearer $CR_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"approved": true, "note": "approved via release-approval environment"}'

  sde_auto:
    name: sde-update-auto
    if: needs.decide.outputs.decision == 'auto_approve'
    needs: [decide]
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-evidence
      - name: Update mock SD Elements (CI-only)
        env:
          MOCK_BASE_URL: ${{ inputs.mock_base_url }}
          SDE_TOKEN: ${{ secrets.MOCK_SDE_TOKEN_CI }}
          CR_TOKEN: ${{ secrets.MOCK_CR_TOKEN }}
          EVIDENCE: evidence.json
          DECISION: auto_approve
          RUN_URL: ${{ env.RUN_URL }}
          DIGEST: ${{ inputs.digest }}
        run: python3 scripts/sde_sync.py

  sde_manual:
    name: sde-update-manual
    if: needs.decide.outputs.decision == 'manual'
    needs: [decide, approval]
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-evidence
      - name: Update mock SD Elements (CI-only)
        env:
          MOCK_BASE_URL: ${{ inputs.mock_base_url }}
          SDE_TOKEN: ${{ secrets.MOCK_SDE_TOKEN_CI }}
          CR_TOKEN: ${{ secrets.MOCK_CR_TOKEN }}
          EVIDENCE: evidence.json
          DECISION: manual
          RUN_URL: ${{ env.RUN_URL }}
          DIGEST: ${{ inputs.digest }}
        run: python3 scripts/sde_sync.py

  sde_reject:
    name: sde-update-reject
    if: needs.decide.outputs.decision == 'reject'
    needs: [decide]
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-evidence
      - name: Update mock SD Elements (all Incomplete on reject)
        env:
          MOCK_BASE_URL: ${{ inputs.mock_base_url }}
          SDE_TOKEN: ${{ secrets.MOCK_SDE_TOKEN_CI }}
          CR_TOKEN: ${{ secrets.MOCK_CR_TOKEN }}
          EVIDENCE: evidence.json
          DECISION: reject
          RUN_URL: ${{ env.RUN_URL }}
          DIGEST: ${{ inputs.digest }}
        run: |
          python3 scripts/sde_sync.py
          echo "Release rejected by policy; countermeasures marked Incomplete."
